<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; max-width: 800px; margin: auto; }
        h1, h2 { color: #2c3e50; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-container, .container-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 25px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
        button:hover { background-color: #219150; }
        .btn-patient { background-color: #2980b9; }
        .btn-patient:hover { background-color: #1f618d; }
        .message { margin-top: 10px; font-weight: bold; }
        .badge { display: inline-block; padding: 4px 8px; background-color: #f39c12; color: white; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>Hospital Management System</h1>

    <!-- SECTION 1: Patient Registration -->
    <div class="form-container">
        <h2>1. Patient Registration</h2>
        <form id="patient-form" onsubmit="return false;">
            <label for="full_name">Full Name:</label>
            <input type="text" id="full_name" placeholder="e.g. Jane Doe">

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob">

            <label for="gender">Gender:</label>
            <select id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" placeholder="e.g. 0771234567">

            <label for="address">Address:</label>
            <input type="text" id="address" placeholder="e.g. 123 Main St">

            <button type="button" class="btn-patient" onclick="handlePatientRegister()">Register Patient</button>
        </form>
        <div id="patient-message" class="message"></div>
    </div>

    <!-- SECTION 2: Available Doctors -->
    <div class="container-box">
        <h2>Available Doctors</h2>
        <div id="doctors-list">Loading doctors...</div>
    </div>

    <!-- SECTION 3: Book Appointment -->
    <div class="form-container">
        <h2>2. Book an Appointment</h2>
        <form id="booking-form">
            <label for="patient_id">Patient ID:</label>
            <input type="number" id="patient_id" placeholder="Enter Patient ID (e.g. 1)" required>

            <label for="doctor_id">Doctor ID:</label>
            <input type="number" id="doctor_id" placeholder="Enter Doctor ID (e.g. 1)" required>

            <label for="appointment_date">Appointment Date & Time:</label>
            <input type="datetime-local" id="appointment_date" required>

            <button type="submit">Book Appointment</button>
        </form>
        <div id="booking-message" class="message"></div>
    </div>

    <!-- SECTION 4: Booked Appointments -->
    <div class="container-box">
        <h2>Booked Appointments</h2>
        <div id="appointments-list">Loading appointments...</div>
    </div>

    <script>
        // 1. Patient Registration Handler
      async function handlePatientRegister() {
    console.log("1. Register button clicked!"); // Debug Log

    const msgDiv = document.getElementById('patient-message');
    msgDiv.style.color = 'blue';
    msgDiv.innerText = 'Connecting to backend...';

    const full_name = document.getElementById('full_name').value.trim();
    const dob = document.getElementById('dob').value;
    const gender = document.getElementById('gender').value;
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();

    if (!full_name || !dob || !phone) {
        msgDiv.style.color = 'red';
        msgDiv.innerText = 'Please fill out Full Name, DOB, and Phone Number.';
        return;
    }

    const payload = { full_name, dob, gender, phone, address };
    console.log("2. Sending payload:", payload); // Debug Log

    try {
        console.log("3. Calling fetch()..."); // Debug Log
        const response = await fetch('http://127.0.0.1:5000/api/patients', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        console.log("4. Response received:", response.status); // Debug Log
        const result = await response.json();

        if (response.ok) {
            msgDiv.style.color = 'green';
            msgDiv.innerText = `Registered! Generated Patient ID: ${result.patient_id}`;
            document.getElementById('patient-form').reset();

            const patientIdInput = document.getElementById('patient_id');
            if (patientIdInput) {
                patientIdInput.value = result.patient_id;
            }
        } else {
            msgDiv.style.color = 'red';
            msgDiv.innerText = 'Database Error: ' + (result.error || 'Unknown error');
        }
    } catch (err) {
        console.error("5. Catch Error Caught:", err); // Debug Log
        msgDiv.style.color = 'red';
        msgDiv.innerText = 'Failed to connect: ' + err.message;
    }
}

            


        // 2. Fetch Doctors List
        async function fetchDoctors() {
            try {
                const response = await fetch('http://localhost:5000/api/doctors');
                const doctors = await response.json();
                const container = document.getElementById('doctors-list');
                container.innerHTML = '';

                if (doctors.length === 0) {
                    container.innerHTML = '<p>No doctors found.</p>';
                    return;
                }

                doctors.forEach(doc => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>Doctor ID: ${doc.doctor_id}</h3>
                        <p><strong>Department:</strong> ${doc.department}</p>
                        <p><strong>Specialization:</strong> ${doc.specialization}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('doctors-list').innerText = 'Failed to load doctors.';
            }
        }

        // 3. Fetch Appointments List
        async function fetchAppointments() {
            try {
                const response = await fetch('http://localhost:5000/api/appointments');
                const appointments = await response.json();
                const container = document.getElementById('appointments-list');
                container.innerHTML = '';

                if (appointments.length === 0) {
                    container.innerHTML = '<p>No appointments booked yet.</p>';
                    return;
                }

                appointments.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>Appointment ID: ${app.appointment_id || app.id}</h3>
                        <p><strong>Patient ID:</strong> ${app.patient_id}</p>
                        <p><strong>Doctor ID:</strong> ${app.doctor_id}</p>
                        <p><strong>Date & Time:</strong> ${new Date(app.appointment_date).toLocaleString()}</p>
                        <p><strong>Status:</strong> <span class="badge">${app.status}</span></p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('appointments-list').innerText = 'Failed to load appointments.';
            }
        }

        // 4. Appointment Booking Handler
        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('booking-message');

            const payload = {
                patient_id: document.getElementById('patient_id').value,
                doctor_id: document.getElementById('doctor_id').value,
                appointment_date: document.getElementById('appointment_date').value,
                status: 'Pending'
            };

            try {
                const response = await fetch('http://localhost:5000/api/appointments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (response.ok) {
                    msgDiv.style.color = 'green';
                    msgDiv.innerText = 'Appointment booked successfully!';
                    document.getElementById('booking-form').reset();
                    fetchAppointments();
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = 'Error: ' + result.error;
                }
            } catch (err) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = 'Failed to connect to server.';
            }
        });

        // Load Doctors and Appointments on page load
        fetchDoctors();
        fetchAppointments();
    </script>
</body>
</html>
